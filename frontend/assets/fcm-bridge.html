<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <title>Aktifkan Notifikasi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --primary: #2563EB;
      /* biru */
      --primary-hover: #1D4ED8;
      /* biru lebih gelap untuk hover */
      --bg: #F9FAFB;
      --card: #FFFFFF;
      --text: #1F2937;
      --muted: #6B7280;
      --border: #E5E7EB;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Inter, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 16px;
      padding: 32px;
      box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.08),
        0 2px 6px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    .icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      background: rgba(249, 115, 22, 0.12);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(37, 99, 235, 0.12);
      /* sesuaikan opacity untuk biru */

    }

    .icon svg {
      width: 28px;
      height: 28px;
      color: var(--primary);
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
      color: var(--text);
    }

    p {
      margin: 12px 0 28px;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: var(--primary);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
    }

    button:hover {
      box-shadow: 0 6px 14px rgba(37, 99, 235, 0.35);
    }

    button:active {
      box-shadow: 0 3px 8px rgba(37, 99, 235, 0.3);
    }

    button.loading {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .hint {
      margin-top: 16px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="icon">
      <!-- Bell icon (modern, outline) -->
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M14 21a2 2 0 01-4 0m8-3H6a1 1 0 01-1-1v-1a6 6 0 1112 0v1a1 1 0 01-1 1z" />
      </svg>
    </div>

    <h1>Aktifkan Notifikasi</h1>
    <p>
      Dapatkan update penting dan informasi terbaru secara real-time langsung
      ke perangkat Anda.
    </p>

    <button id="register-btn">
      <span id="btn-text">Aktifkan Notifikasi</span>
      <span id="btn-loading" style="display:none;">⏳ Memproses...</span>
    </button>

    <div class="hint">
      Anda bisa menonaktifkan notifikasi kapan saja melalui pengaturan browser.
    </div>
  </div>

  <!-- PENTING: TIDAK inline -->
  <script type="module" src="/assets/fcm-bridge.js"></script>
</body>

</html>
